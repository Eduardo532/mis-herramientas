<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sourcing Master | Men's Edition</title>
    <style>
        :root {
            --bg-page: #f1f5f9;
            --primary: #0f172a;
            --accent: #2563eb;
            --text-main: #334155;
            --text-light: #64748b;
            
            /* Colores de Categoría */
            --c-tech: #3b82f6;      /* Azul */
            --c-hobby: #10b981;     /* Verde */
            --c-men: #0f172a;       /* Negro */
            --c-tools: #f97316;     /* Naranja */
            --c-audio: #8b5cf6;     /* Violeta */
            --c-general: #64748b;   /* Gris */

            --card-radius: 16px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        /* HEADER */
        header {
            background: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: relative;
            z-index: 10;
        }

        h1 { margin: 0; font-size: 2.5rem; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        .subtitle { color: var(--text-light); font-size: 1.1rem; margin-top: 5px; }

        /* BARRA DE ACCIONES */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .search-input {
            background: #f8fafc;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid #e2e8f0;
            width: 320px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); background: white; }

        .btn-glossary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }
        .btn-glossary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.3); }

        /* FILTROS */
        .filter-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 10px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-chip {
            border: 1px solid #cbd5e1;
            background: white;
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-chip:hover, .filter-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        /* GRID */
        .container {
            max-width: 1400px;
            margin: 40px auto 100px;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* TARJETA */
        .card {
            background: white;
            border-radius: var(--card-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        /* Border Top Color */
        .card::before { content: ''; display: block; height: 5px; width: 100%; }
        .card[data-cat="tech"]::before { background: var(--c-tech); }
        .card[data-cat="hobby"]::before { background: var(--c-hobby); }
        .card[data-cat="men"]::before { background: var(--c-men); }
        .card[data-cat="tools"]::before { background: var(--c-tools); }
        .card[data-cat="audio"]::before { background: var(--c-audio); }
        .card[data-cat="general"]::before { background: var(--c-general); }

        .card-body { padding: 25px; flex-grow: 1; }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        /* Logo Box Mejorado */
        .logo-box {
            width: 56px;
            height: 56px;
            min-width: 56px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--text-light);
            position: relative;
        }
        
        /* Imagen de logo */
        .logo-img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            border-radius: 6px;
        }

        /* Fallback Text (Inicial) */
        .fallback-text {
            display: none;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0;
            color: var(--primary);
            line-height: 1.2;
        }

        .shipping-tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #10b981;
            display: block;
            margin-top: 4px;
        }
        .shipping-tag.agent { color: #f59e0b; }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-light);
            margin: 0;
            line-height: 1.5;
        }

        .card-footer {
            padding: 20px 25px;
            background: #f8fafc;
            border-top: 1px solid #f1f5f9;
        }

        .btn-visit {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            text-decoration: none;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .btn-visit:hover { color: var(--accent); }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: white;
            width: 90%; max-width: 650px; max-height: 85vh;
            border-radius: 20px;
            padding: 30px;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .term-item { border-bottom: 1px solid #f1f5f9; padding: 15px 0; }
        .term-title { font-weight: 800; color: var(--primary); display: block; margin-bottom: 4px; }
        .term-def { color: var(--text-main); margin: 0; font-size: 0.95rem; }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-cat', item.c);

            // Badge de envío
            let shipText = "Envío Directo";
            let shipClass = "shipping-tag";
            if(item.tags.includes('agente')) {
                shipText = "Requiere Agente";
                shipClass += " agent";
            } else if(item.tags.includes('usa') || item.tags.includes('uk') || item.tags.includes('japon')) {
                shipText = "Envío Internacional";
            }

            // Imagen con Fallback (Google API)
            const logoUrl = `https://www.google.com/s2/favicons?domain=${item.d}&sz=128`;
            const initial = item.n.charAt(0).toUpperCase();

            card.innerHTML = `
                <div class="card-body">
                    <div class="card-header">
                        <div class="logo-box">
                            <img src="${logoUrl}" class="logo-img" 
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                            <span class="fallback-text">${initial}</span>
                        </div>
                        <div>
                            <h3 class="card-title">${item.n}</h3>
                            <span class="${shipClass}">${shipText}</span>
                        </div>
                    </div>
                    <p class="card-desc">${item.desc}</p>
                </div>
                <div class="card-footer">
                    <a href="${item.u}" target="_blank" class="btn-visit">
                        Visitar Sitio <span>&rarr;</span>
                    </a>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterCat(cat) {
        chips.forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('searchInput').value = ''; 
        
        if(cat === 'all') render(database);
        else render(database.filter(i => i.c === cat));
    }

    function filterSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filtered = database.filter(i => 
            i.n.toLowerCase().includes(q) || 
            i.desc.toLowerCase().includes(q) || 
            i.tags.some(t => t.includes(q))
        );
        render(filtered);
        chips.forEach(c => c.classList.remove('active'));
    }

    // Modal
    function toggleModal(show) {
        const modal = document.getElementById('glossaryModal');
        modal.classList.toggle('active', show);
        
        if(show && glossaryList.innerHTML === '') {
            glossaryTerms.forEach(term => {
                glossaryList.innerHTML += `
                    <div class="term-item">
                        <span class="term-title">${term.t}</span>
                        <p class="term-def">${term.d}</p>
                    </div>
                `;
            });
        }
    }
    
    window.onclick = function(e) {
        if(e.target === document.getElementById('glossaryModal')) toggleModal(false);
    }

    render(database);

</script>
</body>
</html>
