<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Poker Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* --- Variables y Estilos Base --- */
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .hidden { display: none !important; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 2rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1, h2 { text-align: center; margin-bottom: 1.5rem; }

        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; }
        
        input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.5rem;
        }

        button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
        button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        button.all-in { background: var(--danger); color: white; }

        /* --- Mesa y Juego --- */
        .table-container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 1.5rem; }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--card-border);
            text-align: center;
        }

        .stat-item span { display: block; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-item strong { font-size: 1.2rem; color: var(--accent); }

        .pot-zone {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
        }

        .pot-amount { font-size: 3rem; font-weight: 800; color: var(--success); }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }

        .player-card {
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: var(--radius);
            padding: 1.2rem;
            position: relative;
        }

        .player-card.is-dealer { border-color: var(--warning); }
        .player-card.is-me { background: rgba(56, 189, 248, 0.05); border-color: var(--card-border); }

        .dealer-badge {
            position: absolute;
            top: -10px;
            right: 10px;
            background: var(--warning);
            color: #0f172a;
            font-size: 0.7rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .player-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .player-name { font-weight: 700; }
        .player-stack { font-size: 1.4rem; font-weight: 800; color: var(--accent); }

        .bet-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; }
        .current-bet { color: var(--success); font-weight: 700; }

        .bet-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
        .bet-grid button { padding: 0.5rem; font-size: 0.8rem; margin: 0; }

        .host-panel {
            background: rgba(239, 68, 68, 0.05);
            border: 1px dashed var(--danger);
            padding: 1.2rem;
            border-radius: var(--radius);
        }

        .winner-select-grid { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
        .winner-select-grid button { width: auto; flex: 1; min-width: 120px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="lobby-view" class="card">
        <h1>Mesa de Poker</h1>
        
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="player-name" placeholder="Ej: Lalo" maxlength="12">
        </div>

        <div id="host-only-config">
            <div class="form-group">
                <label>Stack Inicial</label>
                <input type="number" id="init-stack" value="10000">
            </div>
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>Small Blind</label>
                    <input type="number" id="val-sb" value="50">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Big Blind</label>
                    <input type="number" id="val-bb" value="100">
                </div>
            </div>
            <button id="btn-create">Crear Mesa Maesttra</button>
        </div>
        
        <div style="border-top: 1px solid var(--card-border); margin: 1.5rem 0; padding-top: 1.5rem;">
            <div class="form-group">
                <label>ID de la Sala</label>
                <input type="text" id="room-id" placeholder="CÓDIGO">
            </div>
            <button id="btn-join" class="secondary">Unirse a Partida</button>
        </div>
    </div>

    <div id="table-view" class="table-container hidden">
        <div class="stats-bar">
            <div class="stat-item"><span>Sala</span><strong id="display-id">---</strong></div>
            <div class="stat-item"><span>Stack Inicial</span><strong id="stat-stack">0</strong></div>
            <div class="stat-item"><span>Ciegas</span><strong id="stat-blinds">0/0</strong></div>
            <button id="btn-leave" class="danger" style="width: auto; padding: 0 1rem; margin: 0;">Salir</button>
        </div>

        <div class="pot-zone">
            <div style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Pozo Total</div>
            <div class="pot-amount" id="pot-display">0</div>
        </div>

        <div id="host-panel" class="host-panel hidden">
            <label style="color: var(--danger);">Panel de Control (Host)</label>
            <button id="btn-next-hand" style="background: var(--success); color: white;">Nueva Mano (Rotar D + Ciegas)</button>
            <div class="winner-select-grid" id="winner-list"></div>
        </div>

        <div class="players-grid" id="players-grid"></div>
    </div>

    <script>
        // --- Estado Maestro ---
        let state = {
            isHost: false,
            myId: null,
            hostId: null,
            config: { stack: 10000, sb: 50, bb: 100 },
            game: {
                pot: 0,
                dealerIndex: -1,
                players: [] 
            }
        };

        let peer = null;
        let hostConn = null;
        let clients = new Map();

        const MAX_PLAYERS = 5;

        // --- DOM ---
        const vLobby = document.getElementById('lobby-view');
        const vTable = document.getElementById('table-view');
        const gridPlayers = document.getElementById('players-grid');
        const listWinners = document.getElementById('winner-list');

        // --- Inicialización ---
        document.getElementById('btn-create').onclick = createRoom;
        document.getElementById('btn-join').onclick = joinRoom;
        document.getElementById('btn-leave').onclick = () => location.reload();
        document.getElementById('btn-next-hand').onclick = startNewHand;

        function createRoom() {
            const name = document.getElementById('player-name').value || 'Anfitrión';
            state.config.stack = parseInt(document.getElementById('init-stack').value);
            state.config.sb = parseInt(document.getElementById('val-sb').value);
            state.config.bb = parseInt(document.getElementById('val-bb').value);
            state.isHost = true;

            initPeer(Math.random().toString(36).substring(2, 7).toUpperCase(), (id) => {
                state.hostId = id;
                addPlayer(id, name);
                updateUI();
                vLobby.classList.add('hidden');
                vTable.classList.remove('hidden');
                document.getElementById('host-panel').classList.remove('hidden');
                setupHostLogic();
            });
        }

        function joinRoom() {
            const name = document.getElementById('player-name').value || 'Jugador';
            const room = document.getElementById('room-id').value.toUpperCase();
            if (!room) return;

            initPeer(null, () => {
                hostConn = peer.connect(room, { reliable: true });
                hostConn.on('open', () => {
                    hostConn.send({ type: 'JOIN', name });
                    vLobby.classList.add('hidden');
                    vTable.classList.remove('hidden');
                });
                hostConn.on('data', data => {
                    if (data.type === 'SYNC') {
                        state.game = data.game;
                        state.config = data.config;
                        updateUI();
                    }
                });
            });
        }

        function initPeer(id, onOpen) {
            peer = new Peer(id);
            peer.on('open', onOpen);
            peer.on('error', err => alert('Error: ' + err.type));
        }

        // --- Lógica Host ---
        function setupHostLogic() {
            peer.on('connection', conn => {
                conn.on('data', data => {
                    if (data.type === 'JOIN' && state.game.players.length < MAX_PLAYERS) {
                        clients.set(conn.peer, conn);
                        addPlayer(conn.peer, data.name);
                        sync();
                    } else {
                        handleAction(conn.peer, data);
                    }
                });
                conn.on('close', () => {
                    clients.delete(conn.peer);
                    state.game.players = state.game.players.filter(p => p.id !== conn.peer);
                    sync();
                });
            });
        }

        function addPlayer(id, name) {
            state.game.players.push({
                id, name, 
                chips: state.config.stack, 
                betHand: 0, // Total apostado en la mano actual
                betRound: 0 // Apuesta visible en mesa
            });
        }

        function sync() {
            updateUI();
            const payload = { type: 'SYNC', game: state.game, config: state.config };
            clients.forEach(c => c.send(payload));
        }

        function startNewHand() {
            const pCount = state.game.players.length;
            if (pCount < 2) return;

            state.game.dealerIndex = (state.game.dealerIndex + 1) % pCount;
            const sbIdx = (state.game.dealerIndex + 1) % pCount;
            const bbIdx = (state.game.dealerIndex + 2) % pCount;

            state.game.players.forEach(p => {
                p.betRound = 0;
                p.betHand = 0;
            });
            state.game.pot = 0;

            takeBet(sbIdx, state.config.sb);
            takeBet(bbIdx, state.config.bb);
            sync();
        }

        function takeBet(pIdx, amount) {
            const p = state.game.players[pIdx];
            const actual = Math.min(p.chips, amount);
            p.chips -= actual;
            p.betRound += actual;
            p.betHand += actual;
            state.game.pot += actual;
        }

        function handleAction(pid, act) {
            const p = state.game.players.find(x => x.id === pid);
            if (!p) return;

            if (act.type === 'BET') {
                const amt = Math.min(p.chips, act.amount);
                p.chips -= amt;
                p.betRound += amt;
                p.betHand += amt;
                state.game.pot += amt;
            } else if (act.type === 'ALLIN') {
                const amt = p.chips;
                p.chips = 0;
                p.betRound += amt;
                p.betHand += amt;
                state.game.pot += amt;
            } else if (act.type === 'WIN' && state.isHost) {
                resolvePot(act.winnerId);
            }
            sync();
        }

        function resolvePot(winnerId) {
            const winner = state.game.players.find(p => p.id === winnerId);
            if (!winner) return;

            const winnerContributed = winner.betHand;
            let totalWin = 0;

            state.game.players.forEach(p => {
                const taken = Math.min(p.betHand, winnerContributed);
                totalWin += taken;
                p.betHand -= taken;
            });

            winner.chips += totalWin;
            state.game.pot -= totalWin;
            
            state.game.players.forEach(p => p.betRound = 0);
            sync();
        }

        // --- UI ---
        function updateUI() {
            document.getElementById('display-id').innerText = state.hostId || '---';
            document.getElementById('stat-stack').innerText = state.config.stack;
            document.getElementById('stat-blinds').innerText = `${state.config.sb}/${state.config.bb}`;
            document.getElementById('pot-display').innerText = state.game.pot.toLocaleString();

            gridPlayers.innerHTML = '';
            listWinners.innerHTML = '';

            state.game.players.forEach((p, idx) => {
                const isMe = p.id === (peer ? peer.id : null);
                const isDealer = idx === state.game.dealerIndex;
                
                const card = document.createElement('div');
                card.className = `player-card ${isDealer ? 'is-dealer' : ''} ${isMe ? 'is-me' : ''}`;
                card.innerHTML = `
                    ${isDealer ? '<div class="dealer-badge">DEALER</div>' : ''}
                    <div class="player-info">
                        <span class="player-name">${p.name}</span>
                        <span class="player-stack">${p.chips.toLocaleString()}</span>
                    </div>
                    <div class="bet-row">
                        <span>Apostado:</span>
                        <span class="current-bet">+${p.betRound.toLocaleString()}</span>
                    </div>
                    <div class="bet-grid ${!isMe || p.chips <= 0 ? 'hidden' : ''}">
                        <button onclick="sendBet(50)">+50</button>
                        <button onclick="sendBet(100)">+100</button>
                        <button onclick="sendBet(500)">+500</button>
                        <button class="all-in" onclick="sendAllIn()">ALL IN</button>
                    </div>
                `;
                gridPlayers.appendChild(card);

                if (state.isHost && state.game.pot > 0) {
                    const btnW = document.createElement('button');
                    btnW.innerText = `Pago a ${p.name}`;
                    btnW.className = 'secondary';
                    btnW.onclick = () => handleAction(null, { type: 'WIN', winnerId: p.id });
                    listWinners.appendChild(btnW);
                }
            });
        }

        function sendBet(amount) {
            if (state.isHost) handleAction(peer.id, { type: 'BET', amount });
            else hostConn.send({ type: 'BET', amount });
        }

        function sendAllIn() {
            if (state.isHost) handleAction(peer.id, { type: 'ALLIN' });
            else hostConn.send({ type: 'ALLIN' });
        }
    </script>
</body>
</html>
