<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Poker Pro - Final Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --table: #065f46;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --text: #f8fafc;
            --card: rgba(30, 41, 59, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100dvh; /* Altura dinámica para móviles */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hidden { display: none !important; }

        /* --- LOBBY --- */
        .lobby {
            margin: auto; width: 90%; max-width: 400px; padding: 2rem;
            background: var(--card); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
            color: white; font-size: 1rem; margin-bottom: 1rem;
        }
        button {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            font-weight: 800; cursor: pointer; font-size: 1rem;
        }
        .btn-main { background: var(--accent); color: #0f172a; }
        .btn-sec { background: transparent; border: 1px solid var(--accent); color: var(--accent); margin-top: 10px; }

        /* --- INTERFAZ DE JUEGO --- */
        .game-screen { display: flex; flex-direction: column; height: 100%; }

        /* Barra de Fase e Info */
        .top-bar {
            background: rgba(0,0,0,0.4); padding: 8px; display: flex;
            justify-content: center; gap: 4px; flex-wrap: wrap; z-index: 100;
        }
        .phase-tag { font-size: 0.65rem; padding: 4px 8px; border-radius: 4px; opacity: 0.3; font-weight: 800; }
        .phase-tag.active { opacity: 1; background: var(--accent); color: #000; box-shadow: 0 0 10px var(--accent); }

        /* Consola Host (Superior) */
        .host-console {
            background: rgba(239, 68, 68, 0.1); padding: 10px;
            display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid var(--danger);
        }
        .host-console button { width: auto; padding: 6px 12px; font-size: 0.75rem; }

        /* Zona de Mesa */
        .table-container {
            flex: 1; position: relative; width: 100%; display: flex;
            align-items: center; justify-content: center; padding: 40px 10px;
        }
        .felt {
            width: 85%; max-width: 550px; aspect-ratio: 1.8/1;
            background: var(--table); border: 8px solid #047857;
            border-radius: 1000px; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.4);
        }
        .pot-display { text-align: center; pointer-events: none; }
        .pot-val { font-size: 2.2rem; font-weight: 900; color: white; }

        /* Anillo de Jugadores */
        .ring { position: absolute; inset: 0; pointer-events: none; }
        .player {
            position: absolute; width: 75px; pointer-events: auto;
            display: flex; flex-direction: column; align-items: center;
            transform: translate(-50%, -50%); transition: all 0.5s ease-out;
        }
        .avatar {
            width: 44px; height: 44px; background: #1e293b; border: 3px solid #334155;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 900; position: relative;
        }
        .player.turn .avatar { border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }
        .player.folded { opacity: 0.4; }
        
        .p-name { font-size: 0.65rem; font-weight: 700; margin-top: 4px; text-shadow: 0 1px 2px #000; }
        .p-chips { font-size: 0.75rem; color: var(--success); font-weight: 800; }
        .bet-tag {
            background: var(--warning); color: #000; font-size: 0.65rem;
            padding: 2px 6px; border-radius: 8px; font-weight: 900; margin-top: -8px;
        }
        .dealer {
            position: absolute; -right: 6px; -bottom: 6px; background: white;
            color: black; width: 16px; height: 16px; border-radius: 50%;
            font-size: 0.6rem; display: flex; align-items: center; justify-content: center; font-weight: 900;
        }
        .kick-btn {
            position: absolute; -left: 6px; -top: 6px; background: var(--danger);
            color: white; width: 16px; height: 16px; border-radius: 50%;
            font-size: 0.6rem; display: flex; align-items: center; justify-content: center;
        }

        /* --- HERO PANEL (Fijo inferior) --- */
        .hero {
            background: #1e293b; padding: 15px; flex-shrink: 0;
            border-top: 2px solid rgba(255,255,255,0.05);
            padding-bottom: max(15px, env(safe-area-inset-bottom));
        }
        .hero-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .hero-actions { display: flex; gap: 8px; }
        .hero-actions button { flex: 1; padding: 12px; font-size: 0.9rem; }
        .raise-box { display: flex; gap: 6px; margin-top: 8px; }
        .raise-box input { margin: 0; flex: 1; text-align: center; padding: 8px; }
    </style>
</head>
<body>

    <div id="lobby" class="lobby">
        <h2 style="text-align:center; margin-bottom:1.5rem">Poker Chips Pro</h2>
        <input type="text" id="nick" placeholder="Tu Nombre" maxlength="10">
        <div id="host-setup">
            <label style="font-size:0.7rem; color:var(--accent)">CONFIGURACIÓN INICIAL</label>
            <input type="number" id="cfg-stack" value="10000">
            <div style="display:flex; gap:10px">
                <input type="number" id="cfg-sb" value="50">
                <input type="number" id="cfg-bb" value="100">
            </div>
            <button class="btn-main" onclick="startAsHost()">CREAR SALA</button>
        </div>
        <div style="margin:1rem 0; text-align:center; opacity:0.4">--- O ---</div>
        <input type="text" id="join-id" placeholder="ID DE SALA">
        <button class="btn-sec" onclick="startAsClient()">UNIRSE A SALA</button>
    </div>

    <div id="game" class="game-screen hidden">
        <div class="top-bar">
            <div class="phase-tag" id="ph-PREFLOP">PRE-FLOP</div>
            <div class="phase-tag" id="ph-FLOP">FLOP</div>
            <div class="phase-tag" id="ph-TURN">TURN</div>
            <div class="phase-tag" id="ph-RIVER">RIVER</div>
            <div class="phase-tag" id="ph-SHOWDOWN">PAGOS</div>
        </div>

        <div id="host-bar" class="host-console hidden">
            <button class="btn-main" id="btn-deal" onclick="h_NewHand()">NUEVA MANO</button>
            <button class="danger" onclick="h_ForceEnd()">FORZAR FIN</button>
            <div id="winner-list" style="display:flex; gap:4px"></div>
        </div>

        <div class="table-container" id="table-zone">
            <div class="felt">
                <div class="pot-display">
                    <div style="font-size:0.7rem; opacity:0.6; text-transform:uppercase">Pozo</div>
                    <div class="pot-val" id="ui-pot">0</div>
                </div>
            </div>
            <div class="ring" id="player-ring"></div>
        </div>

        <div class="hero">
            <div class="hero-info">
                <div><strong id="h-name">YO</strong> <span id="ui-room" style="font-size:0.7rem; opacity:0.5; margin-left:10px"></span></div>
                <div style="font-size:1.4rem; font-weight:900; color:var(--accent)" id="h-chips">0</div>
            </div>
            <div id="h-controls" class="hidden">
                <div class="hero-actions">
                    <button style="background:var(--danger); color:white" onclick="doAction('FOLD')">FOLD</button>
                    <button style="background:var(--accent); color:#000" id="btn-call" onclick="doAction('CALL')">CHECK</button>
                </div>
                <div class="raise-box">
                    <input type="number" id="r-val" step="10">
                    <button style="background:var(--success); color:white" onclick="doAction('RAISE')">RAISE</button>
                </div>
            </div>
            <div id="h-wait" style="text-align:center; color:var(--text-muted); font-size:0.9rem">Esperando...</div>
        </div>
    </div>

    <script>
        const state = {
            isHost: false, myId: null, room: null,
            cfg: { stack: 10000, sb: 50, bb: 100 },
            game: { phase: 'WAITING', pot: 0, bet: 0, dIdx: -1, tIdx: -1, players: [] }
        };

        let peer, hostConn, clients = new Map();

        // --- INICIO Y RED ---
        function startAsHost() {
            state.isHost = true;
            state.cfg = {
                stack: parseInt(document.getElementById('cfg-stack').value),
                sb: parseInt(document.getElementById('cfg-sb').value),
                bb: parseInt(document.getElementById('cfg-bb').value)
            };
            initPeer(genId(), (id) => {
                state.room = id;
                addP(id, document.getElementById('nick').value || 'Host');
                goGame();
                peer.on('connection', c => {
                    c.on('data', d => {
                        if(d.type === 'JOIN') { clients.set(c.peer, c); addP(c.peer, d.name); sync(); }
                        else h_Handle(c.peer, d);
                    });
                });
            });
        }

        function startAsClient() {
            const rid = document.getElementById('join-id').value.toUpperCase().trim();
            if(!rid) return;
            initPeer(null, (id) => {
                hostConn = peer.connect(rid, { reliable: true });
                hostConn.on('open', () => {
                    state.room = rid;
                    hostConn.send({ type: 'JOIN', name: document.getElementById('nick').value || 'P' });
                    goGame();
                });
                hostConn.on('data', d => { if(d.type==='SYNC') { state.game = d.game; state.cfg = d.cfg; render(); } });
            });
        }

        function initPeer(fixedId, cb) {
            const saved = sessionStorage.getItem('poker_pid');
            peer = new Peer(fixedId || saved || null);
            peer.on('open', id => { 
                state.myId = id; 
                sessionStorage.setItem('poker_pid', id); 
                cb(id); 
            });
            peer.on('error', () => { sessionStorage.clear(); location.reload(); });
        }

        function genId() { return Math.random().toString(36).substring(2,7).toUpperCase(); }
        function goGame() { document.getElementById('lobby').classList.add('hidden'); document.getElementById('game').classList.remove('hidden'); render(); }

        // --- LÓGICA HOST ---
        function addP(id, name) {
            let p = state.game.players.find(x => x.id === id);
            if(p) { p.active = true; p.name = name; }
            else state.game.players.push({ id, name, chips: state.cfg.stack, bRound: 0, status: 'ACTIVE', active: true });
        }

        function sync() { render(); clients.forEach(c => c.send({ type: 'SYNC', game: state.game, cfg: state.cfg })); }

        function h_NewHand() {
            if(state.game.players.length < 2) return;
            state.game.phase = 'PREFLOP';
            state.game.pot = 0; state.game.bet = state.cfg.bb;
            state.game.dIdx = (state.game.dIdx + 1) % state.game.players.length;
            state.game.players.forEach(p => { p.bRound = 0; p.status = p.chips > 0 ? 'ACTIVE' : 'OUT'; p.acted = false; });
            
            const L = state.game.players.length;
            h_ForceBet((state.game.dIdx + 1)%L, state.cfg.sb);
            h_ForceBet((state.game.dIdx + 2)%L, state.cfg.bb);
            state.game.tIdx = (state.game.dIdx + 3)%L;
            h_ValidTurn(); sync();
        }

        function h_ForceBet(idx, amt) {
            let p = state.game.players[idx];
            let take = Math.min(p.chips, amt);
            p.chips -= take; p.bRound += take;
            if(p.chips === 0) p.status = 'ALLIN';
        }

        function h_Handle(pid, act) {
            let p = state.game.players.find(x => x.id === pid);
            if(!p || state.game.tIdx !== state.game.players.indexOf(p)) return;
            p.acted = true;
            if(act.t === 'FOLD') p.status = 'FOLDED';
            if(act.t === 'CALL') {
                let diff = state.game.bet - p.bRound;
                let take = Math.min(p.chips, diff);
                p.chips -= take; p.bRound += take;
                if(p.chips === 0) p.status = 'ALLIN';
            }
            if(act.t === 'RAISE') {
                let add = act.v - p.bRound;
                if(p.chips >= add && act.v > state.game.bet) {
                    p.chips -= add; p.bRound = act.v; state.game.bet = act.v;
                    state.game.players.forEach(x => { if(x!==p && x.status==='ACTIVE') x.acted = false; });
                }
            }
            h_Next(); sync();
        }

        function h_ValidTurn() {
            let count = 0;
            while(state.game.players[state.game.tIdx].status !== 'ACTIVE' && count < 10) {
                state.game.tIdx = (state.game.tIdx + 1) % state.game.players.length;
                count++;
            }
        }

        function h_Next() {
            let actv = state.game.players.filter(p => p.status === 'ACTIVE');
            let need = actv.filter(p => !p.acted || p.bRound < state.game.bet);
            let play = state.game.players.filter(p => !['FOLDED','OUT'].includes(p.status));

            if(play.length === 1 || (actv.length === 0 && need.length === 0)) {
                h_Collect(); state.game.phase = 'SHOWDOWN'; return;
            }
            if(need.length === 0) {
                h_Collect();
                const seq = ['PREFLOP','FLOP','TURN','RIVER','SHOWDOWN'];
                state.game.phase = seq[seq.indexOf(state.game.phase) + 1];
                if(state.game.phase !== 'SHOWDOWN') {
                    state.game.bet = 0; state.game.players.forEach(p => p.acted = false);
                    state.game.tIdx = (state.game.dIdx + 1) % state.game.players.length;
                    h_ValidTurn();
                }
            } else {
                state.game.tIdx = (state.game.tIdx + 1) % state.game.players.length;
                h_ValidTurn();
            }
        }

        function h_Collect() { state.game.players.forEach(p => { state.game.pot += p.bRound; p.bRound = 0; }); }

        function h_Award(pid) {
            let p = state.game.players.find(x => x.id === pid);
            p.chips += state.game.pot; state.game.pot = 0; state.game.phase = 'WAITING'; sync();
        }

        function h_ForceEnd() {
            state.game.players.forEach(p => { p.chips += p.bRound; p.bRound = 0; });
            state.game.pot = 0; state.game.phase = 'WAITING'; sync();
        }

        function h_Kick(pid) {
            state.game.players = state.game.players.filter(x => x.id !== pid);
            sync();
        }

        // --- CLIENTE ---
        function doAction(t) {
            let v = t === 'RAISE' ? parseInt(document.getElementById('r-val').value) : 0;
            if(state.isHost) h_Handle(state.myId, {t, v}); else hostConn.send({t, v});
        }

        // --- RENDER ---
        function render() {
            if(!state.room) return;
            document.getElementById('ui-pot').innerText = state.game.pot.toLocaleString();
            document.getElementById('ui-room').innerText = "#" + state.room;
            document.querySelectorAll('.phase-tag').forEach(el => el.classList.toggle('active', el.id === 'ph-'+state.game.phase));

            const ring = document.getElementById('player-ring');
            ring.innerHTML = '';
            const P = state.game.players;
            const zone = document.getElementById('table-zone');
            const RX = (zone.clientWidth / 2) - 40;
            const RY = (zone.clientHeight / 2) - 45;

            P.forEach((p, i) => {
                const ang = (i * (360/P.length)) - 90;
                const rad = ang * Math.PI / 180;
                const node = document.createElement('div');
                node.className = `player ${p.status==='FOLDED'?'folded':''} ${state.game.tIdx===i?'turn':''}`;
                node.style.left = `calc(50% + ${Math.cos(rad)*RX}px)`;
                node.style.top = `calc(50% + ${Math.sin(rad)*RY}px)`;

                node.innerHTML = `
                    ${p.bRound > 0 ? `<div class="bet-tag">${p.bRound}</div>` : ''}
                    <div class="avatar">
                        ${p.name[0]}
                        ${state.game.dIdx === i ? '<div class="dealer">D</div>' : ''}
                        ${state.isHost && p.id !== state.myId ? `<div class="kick-btn" onclick="h_Kick('${p.id}')">×</div>` : ''}
                    </div>
                    <div class="p-name">${p.id === state.myId ? 'TÚ' : p.name}</div>
                    <div class="p-chips">${p.chips.toLocaleString()}</div>
                `;
                ring.appendChild(node);
            });

            const me = P.find(x => x.id === state.myId);
            if(me) {
                document.getElementById('h-chips').innerText = me.chips.toLocaleString();
                const isMyT = state.game.tIdx === P.indexOf(me) && !['WAITING','SHOWDOWN'].includes(state.game.phase);
                document.getElementById('h-controls').classList.toggle('hidden', !isMyT || me.status !== 'ACTIVE');
                document.getElementById('h-wait').classList.toggle('hidden', isMyT && me.status === 'ACTIVE');
                if(isMyT) {
                    let diff = state.game.bet - me.bRound;
                    document.getElementById('btn-call').innerText = diff > 0 ? `CALL ${diff}` : 'CHECK';
                    document.getElementById('r-val').min = state.game.bet + state.cfg.bb;
                    document.getElementById('r-val').value = state.game.bet + state.cfg.bb;
                }
            }

            if(state.isHost) {
                document.getElementById('host-bar').classList.remove('hidden');
                document.getElementById('btn-deal').style.display = state.game.phase === 'WAITING' ? 'block' : 'none';
                const wins = document.getElementById('winner-list'); wins.innerHTML = '';
                if(state.game.phase === 'SHOWDOWN') {
                    P.filter(x => !['FOLDED','OUT'].includes(x.status)).forEach(x => {
                        wins.innerHTML += `<button class="btn-main" onclick="h_Award('${x.id}')">Gana ${x.name}</button>`;
                    });
                }
            }
        }

        window.addEventListener('resize', render);
    </script>
</body>
</html>
