<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poker Chips Pro - Mesa Circular</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --card-border: rgba(255, 255, 255, 0.1);
            --table-green: #065f46;
            --table-border: #059669;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at center, #1e293b, #0f172a);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hidden { display: none !important; }

        /* --- LOBBY --- */
        .lobby-container {
            max-width: 400px; width: 90%; margin: auto; padding: 2rem;
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--card-border); border-radius: var(--radius);
        }
        input {
            width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border); border-radius: 8px;
            color: white; font-size: 1rem; margin-bottom: 1rem; outline: none;
        }
        button {
            width: 100%; padding: 0.8rem; background: var(--accent); color: #0f172a;
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer;
        }

        /* --- MESA DE JUEGO --- */
        .game-view { display: flex; flex-direction: column; height: 100%; }

        /* Indicador de Ronda */
        .round-bar {
            display: flex; justify-content: center; gap: 5px; padding: 10px;
            background: rgba(0,0,0,0.5); font-size: 0.7rem; font-weight: 800;
        }
        .round-step { padding: 4px 8px; border-radius: 4px; color: var(--text-muted); opacity: 0.5; }
        .round-step.active { color: var(--accent); border: 1px solid var(--accent); opacity: 1; box-shadow: 0 0 10px var(--accent); }

        .table-area {
            flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
            padding: 20px; perspective: 1000px;
        }

        /* Mesa Central */
        .poker-table {
            width: 100%; max-width: 500px; aspect-ratio: 16/9;
            background: var(--table-green); border: 8px solid var(--table-border);
            border-radius: 150px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.6), 0 20px 40px rgba(0,0,0,0.4);
        }
        .pot-box { text-align: center; }
        .pot-label { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); }
        .pot-value { font-size: 2.5rem; font-weight: 900; color: white; }

        /* Jugadores en Círculo */
        .player-ring {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            pointer-events: none;
        }
        .player-node {
            position: absolute; width: 85px; pointer-events: auto;
            display: flex; flex-direction: column; align-items: center;
        }
        .player-avatar {
            width: 50px; height: 50px; background: var(--card-bg);
            border: 3px solid var(--card-border); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; position: relative;
        }
        .player-node.active-turn .player-avatar { border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }
        .player-node.folded { opacity: 0.4; filter: grayscale(1); }
        
        .player-name { font-size: 0.7rem; font-weight: 700; margin-top: 4px; text-align: center; white-space: nowrap; }
        .player-chips { font-size: 0.8rem; color: var(--success); font-weight: 800; }
        .player-bet-bubble {
            background: var(--warning); color: black; font-size: 0.7rem;
            padding: 2px 6px; border-radius: 10px; font-weight: 800;
            margin-top: 2px;
        }
        .dealer-chip {
            position: absolute; bottom: -5px; right: -5px; background: white;
            color: black; width: 18px; height: 18px; border-radius: 50%;
            font-size: 0.6rem; display: flex; align-items: center; justify-content: center;
            font-weight: 900; border: 1px solid #000;
        }

        /* --- HERO PANEL --- */
        .hero-panel {
            background: #1e293b; border-top: 2px solid var(--card-border);
            padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .hero-data { display: flex; justify-content: space-between; align-items: center; }
        .hero-stack { font-size: 1.4rem; font-weight: 900; color: var(--accent); }
        
        .action-row { display: flex; gap: 8px; }
        .action-row button { flex: 1; padding: 15px 5px; font-size: 0.9rem; }
        .btn-fold { background: var(--danger); color: white; }
        .btn-call { background: var(--accent); color: #000; }
        .btn-raise { background: var(--success); color: white; }

        .raise-control { display: flex; gap: 5px; align-items: center; }
        .raise-control input { margin: 0; flex: 1; text-align: center; }

        /* Host Controls */
        .host-overlay {
            position: absolute; bottom: 10px; width: 100%;
            display: flex; justify-content: center; gap: 10px;
        }
        .host-overlay button { width: auto; padding: 8px 15px; font-size: 0.8rem; }

        /* Ajustes Móviles */
        @media (max-width: 600px) {
            .poker-table { max-width: 280px; }
            .pot-value { font-size: 1.8rem; }
            .player-node { width: 70px; }
            .player-avatar { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <div id="lobby" class="lobby-container">
        <h2 style="text-align:center; margin-bottom:1.5rem">Mesa Virtual Poker</h2>
        <input type="text" id="p-name" placeholder="Tu Nombre">
        <div id="host-setup">
            <label style="font-size:0.7rem; color:var(--accent)">CONFIGURACIÓN HOST</label>
            <input type="number" id="h-stack" value="10000">
            <div style="display:flex; gap:10px">
                <input type="number" id="h-sb" value="50">
                <input type="number" id="h-bb" value="100">
            </div>
            <button onclick="createRoom()">CREAR MESA</button>
        </div>
        <div style="margin:1rem 0; text-align:center; opacity:0.5">--- O ---</div>
        <input type="text" id="j-room" placeholder="ID SALA">
        <button class="secondary" onclick="joinRoom()">UNIRSE A MESA</button>
    </div>

    <div id="game" class="game-view hidden">
        <div class="round-bar" id="round-indicator">
            <div class="round-step" id="step-PREFLOP">PRE-FLOP</div>
            <div class="round-step" id="step-FLOP">FLOP</div>
            <div class="round-step" id="step-TURN">TURN</div>
            <div class="round-step" id="step-RIVER">RIVER</div>
            <div class="round-step" id="step-SHOWDOWN">SHOWDOWN</div>
        </div>

        <div class="table-area">
            <div class="poker-table">
                <div class="pot-box">
                    <div class="pot-label">Pozo Total</div>
                    <div class="pot-value" id="ui-pot">0</div>
                </div>
                <div id="host-ui" class="host-overlay hidden">
                    <button class="success" id="btn-start" onclick="hostStartHand()">INICIAR</button>
                    <div id="winner-picks" style="display:flex; gap:5px"></div>
                    <button class="danger" onclick="hostForceEnd()">FORZAR CIERRE</button>
                </div>
            </div>
            <div class="player-ring" id="player-ring"></div>
        </div>

        <div class="hero-panel" id="hero-panel">
            <div class="hero-data">
                <div><strong id="hero-name-label">YO</strong> <span style="font-size:0.7rem; opacity:0.6" id="ui-room-id"></span></div>
                <div class="hero-stack" id="hero-chips">0</div>
            </div>
            <div id="hero-controls" class="hidden">
                <div class="action-row">
                    <button class="btn-fold" onclick="sendAction('FOLD')">FOLD</button>
                    <button class="btn-call" id="btn-call-label" onclick="sendAction('CALL')">CHECK</button>
                </div>
                <div class="raise-control">
                    <input type="number" id="raise-val" value="200">
                    <button class="btn-raise" onclick="sendAction('RAISE')">RAISE</button>
                </div>
            </div>
            <div id="hero-msg" style="text-align:center; font-size:0.9rem; color:var(--text-muted)">Esperando partida...</div>
        </div>
    </div>

    <script>
        let s = {
            isHost: false, myId: null, hostId: null,
            cfg: { stack: 10000, sb: 50, bb: 100 },
            game: { phase: 'WAITING', pot: 0, currentBet: 0, dealerIdx: -1, turnIdx: -1, players: [] }
        };
        let peer, hostConn, clients = new Map();

        function createRoom() {
            s.isHost = true;
            s.cfg.stack = parseInt(document.getElementById('h-stack').value);
            s.cfg.sb = parseInt(document.getElementById('h-sb').value);
            s.cfg.bb = parseInt(document.getElementById('h-bb').value);
            initPeer(Math.random().toString(36).substring(2,7).toUpperCase(), (id) => {
                s.hostId = id;
                addPlayer(id, document.getElementById('p-name').value || 'Host');
                render();
                document.getElementById('lobby').classList.add('hidden');
                document.getElementById('game').classList.remove('hidden');
                setupHost();
            });
        }

        function joinRoom() {
            const room = document.getElementById('j-room').value.toUpperCase();
            initPeer(null, () => {
                hostConn = peer.connect(room, { reliable: true });
                hostConn.on('open', () => {
                    s.hostId = room;
                    hostConn.send({ type: 'JOIN', name: document.getElementById('p-name').value || 'Player' });
                    document.getElementById('lobby').classList.add('hidden');
                    document.getElementById('game').classList.remove('hidden');
                });
                hostConn.on('data', d => { if(d.type === 'SYNC') { s.game = d.game; s.cfg = d.cfg; render(); } });
            });
        }

        function initPeer(id, cb) {
            peer = new Peer(id);
            peer.on('open', pid => { s.myId = pid; cb(pid); });
            peer.on('error', e => { alert("Error PeerJS: " + e.type); location.reload(); });
        }

        function setupHost() {
            peer.on('connection', conn => {
                conn.on('data', msg => {
                    if(msg.type === 'JOIN') {
                        clients.set(conn.peer, conn);
                        addPlayer(conn.peer, msg.name);
                        sync();
                    } else { processAction(conn.peer, msg); }
                });
            });
        }

        function addPlayer(id, name) {
            s.game.players.push({ id, name, chips: s.cfg.stack, betRound: 0, status: 'ACTIVE', acted: false });
        }

        function sync() {
            render();
            clients.forEach(c => c.send({ type: 'SYNC', game: s.game, cfg: s.cfg }));
        }

        // --- MOTOR DE JUEGO ---
        function hostStartHand() {
            if(s.game.players.length < 2) return;
            s.game.phase = 'PREFLOP';
            s.game.pot = 0;
            s.game.currentBet = s.cfg.bb;
            s.game.dealerIdx = (s.game.dealerIdx + 1) % s.game.players.length;
            s.game.players.forEach(p => { p.betRound = 0; p.status = (p.chips > 0) ? 'ACTIVE' : 'OUT'; p.acted = false; });
            
            const len = s.game.players.length;
            forceBet((s.game.dealerIdx + 1) % len, s.cfg.sb);
            forceBet((s.game.dealerIdx + 2) % len, s.cfg.bb);
            s.game.turnIdx = (s.game.dealerIdx + 3) % len;
            ensureValidTurn();
            sync();
        }

        function forceBet(idx, amt) {
            let p = s.game.players[idx];
            let actual = Math.min(p.chips, amt);
            p.chips -= actual; p.betRound += actual;
            if(p.chips === 0) p.status = 'ALLIN';
        }

        function processAction(pid, act) {
            let p = s.game.players.find(x => x.id === pid);
            if(!p || s.game.players[s.game.turnIdx].id !== pid) return;
            p.acted = true;
            if(act.type === 'FOLD') p.status = 'FOLDED';
            if(act.type === 'CALL') {
                let diff = s.game.currentBet - p.betRound;
                let take = Math.min(p.chips, diff);
                p.chips -= take; p.betRound += take;
                if(p.chips === 0) p.status = 'ALLIN';
            }
            if(act.type === 'RAISE') {
                if(act.amt > s.game.currentBet) {
                    let add = act.amt - p.betRound;
                    if(p.chips >= add) {
                        p.chips -= add; p.betRound = act.amt; s.game.currentBet = act.amt;
                        s.game.players.forEach(x => { if(x.id !== p.id && x.status === 'ACTIVE') x.acted = false; });
                    }
                }
            }
            advanceTurn(); sync();
        }

        function advanceTurn() {
            let actives = s.game.players.filter(p => p.status === 'ACTIVE');
            let waiting = actives.filter(p => !p.acted || p.betRound < s.game.currentBet);
            let notFolded = s.game.players.filter(p => p.status !== 'FOLDED' && p.status !== 'OUT');

            if(notFolded.length === 1 || (actives.length === 0 && waiting.length === 0)) {
                endRound(); s.game.phase = 'SHOWDOWN'; return;
            }
            if(waiting.length === 0) {
                endRound();
                const steps = ['PREFLOP', 'FLOP', 'TURN', 'RIVER', 'SHOWDOWN'];
                s.game.phase = steps[steps.indexOf(s.game.phase) + 1];
                if(s.game.phase !== 'SHOWDOWN') {
                    s.game.currentBet = 0; s.game.players.forEach(p => p.acted = false);
                    s.game.turnIdx = (s.game.dealerIdx + 1) % s.game.players.length;
                    ensureValidTurn();
                }
            } else {
                s.game.turnIdx = (s.game.turnIdx + 1) % s.game.players.length;
                ensureValidTurn();
            }
        }

        function ensureValidTurn() {
            let count = 0;
            while(s.game.players[s.game.turnIdx].status !== 'ACTIVE' && count < 10) {
                s.game.turnIdx = (s.game.turnIdx + 1) % s.game.players.length;
                count++;
            }
        }

        function endRound() { s.game.players.forEach(p => { s.game.pot += p.betRound; p.betRound = 0; }); }

        function hostAwardPot(pid) {
            let p = s.game.players.find(x => x.id === pid);
            p.chips += s.game.pot; s.game.pot = 0; s.game.phase = 'WAITING'; sync();
        }

        function hostForceEnd() {
            s.game.players.forEach(p => { p.chips += p.betRound; p.betRound = 0; });
            s.game.pot = 0; s.game.phase = 'WAITING'; sync();
        }

        function sendAction(type) {
            let payload = { type };
            if(type === 'RAISE') payload.amt = parseInt(document.getElementById('raise-val').value);
            if(s.isHost) processAction(s.myId, payload); else hostConn.send(payload);
        }

        // --- RENDERIZADO ---
        function render() {
            document.getElementById('ui-pot').innerText = s.game.pot.toLocaleString();
            document.getElementById('ui-room-id').innerText = "#" + s.hostId;
            
            // Indicador Ronda
            document.querySelectorAll('.round-step').forEach(el => el.classList.remove('active'));
            if(document.getElementById('step-' + s.game.phase)) 
                document.getElementById('step-' + s.game.phase).classList.add('active');

            // Mesa y Jugadores Circular
            const container = document.getElementById('player-ring');
            container.innerHTML = '';
            const total = s.game.players.length;
            const radius = window.innerWidth < 600 ? 110 : 180;

            s.game.players.forEach((p, i) => {
                const angle = (i * (360 / total)) - 90;
                const rad = angle * (Math.PI / 180);
                const x = Math.cos(rad) * radius;
                const y = Math.sin(rad) * radius;

                const node = document.createElement('div');
                node.className = `player-node ${p.status === 'FOLDED' ? 'folded' : ''} ${s.game.turnIdx === i ? 'active-turn' : ''}`;
                node.style.left = `calc(50% + ${x}px - 42px)`;
                node.style.top = `calc(50% + ${y}px - 40px)`;
                
                node.innerHTML = `
                    <div class="player-avatar">
                        ${p.name[0]}
                        ${s.game.dealerIdx === i ? '<div class="dealer-chip">D</div>' : ''}
                    </div>
                    <div class="player-name">${p.id === s.myId ? 'TÚ' : p.name}</div>
                    <div class="player-chips">${p.chips.toLocaleString()}</div>
                    ${p.betRound > 0 ? `<div class="player-bet-bubble">${p.betRound}</div>` : ''}
                `;
                container.appendChild(node);
            });

            // Hero Panel
            const my = s.game.players.find(x => x.id === s.myId);
            if(my) {
                document.getElementById('hero-chips').innerText = my.chips.toLocaleString();
                const isMyTurn = s.game.turnIdx === s.game.players.indexOf(my) && s.game.phase !== 'WAITING' && s.game.phase !== 'SHOWDOWN';
                
                if(isMyTurn && my.status === 'ACTIVE') {
                    document.getElementById('hero-controls').classList.remove('hidden');
                    document.getElementById('hero-msg').classList.add('hidden');
                    const diff = s.game.currentBet - my.betRound;
                    document.getElementById('btn-call-label').innerText = diff > 0 ? `CALL ${diff}` : 'CHECK';
                    document.getElementById('raise-val').min = s.game.currentBet + s.cfg.bb;
                } else {
                    document.getElementById('hero-controls').classList.add('hidden');
                    document.getElementById('hero-msg').classList.remove('hidden');
                    document.getElementById('hero-msg').innerText = (my.status === 'FOLDED') ? "Te has retirado" : "Esperando turno...";
                }
            }

            // Host Controls
            if(s.isHost) {
                document.getElementById('host-ui').classList.remove('hidden');
                document.getElementById('btn-start').style.display = (s.game.phase === 'WAITING') ? 'block' : 'none';
                const winArea = document.getElementById('winner-picks');
                winArea.innerHTML = '';
                if(s.game.phase === 'SHOWDOWN') {
                    s.game.players.filter(p => p.status !== 'FOLDED' && p.status !== 'OUT').forEach(p => {
                        winArea.innerHTML += `<button onclick="hostAwardPot('${p.id}')">Gana ${p.name}</button>`;
                    });
                }
            }
        }
    </script>
</body>
</html>
