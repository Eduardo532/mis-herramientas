<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Poker Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --table-green: rgba(16, 185, 129, 0.15);
            --table-border: rgba(16, 185, 129, 0.4);
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at top, #1e293b, #0f172a);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hidden { display: none !important; }

        input {
            width: 100%; padding: 0.8rem; background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border); border-radius: 8px;
            color: white; font-size: 1rem; outline: none; margin-bottom: 1rem;
        }

        button {
            width: 100%; padding: 1rem; background: var(--accent); color: #0f172a;
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
        button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        button.success { background: var(--success); color: white; }

        .lobby-container {
            max-width: 480px; width: 100%; margin: auto; padding: 2rem;
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--card-border); border-radius: var(--radius);
        }

        .table-view {
            display: flex; flex-direction: column; height: 100%;
        }

        .header-bar {
            display: flex; justify-content: space-between; padding: 1rem;
            background: rgba(15, 23, 42, 0.8); border-bottom: 1px solid var(--card-border);
            font-size: 0.8rem; color: var(--text-muted);
        }

        .game-area {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: space-between; padding: 2rem 1rem; position: relative;
        }

        .opponents-ring {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem;
            width: 100%; max-width: 800px; z-index: 10;
        }

        .opponent-card {
            background: var(--card-bg); border: 2px solid var(--card-border);
            border-radius: 12px; padding: 1rem; min-width: 140px; text-align: center;
            position: relative; transition: all 0.3s;
        }
        .opponent-card.is-turn { border-color: var(--accent); box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .opponent-card.folded { opacity: 0.5; filter: grayscale(1); }

        .op-name { font-weight: 700; font-size: 1rem; margin-bottom: 0.2rem; }
        .op-chips { color: var(--success); font-weight: 800; font-size: 1.1rem; }
        .op-bet { margin-top: 0.5rem; font-size: 0.9rem; color: var(--warning); min-height: 1.2rem; }
        .op-status { font-size: 0.75rem; text-transform: uppercase; margin-top: 0.2rem; }
        
        .dealer-btn {
            position: absolute; top: -10px; right: -10px; width: 24px; height: 24px;
            background: white; color: black; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 0.8rem; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .center-table {
            background: var(--table-green); border: 4px solid var(--table-border);
            border-radius: 100px; width: 100%; max-width: 600px; min-height: 180px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5); padding: 1.5rem; text-align: center;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        .phase-indicator { color: var(--accent); font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.5rem; }
        .pot-total { font-size: 3.5rem; font-weight: 900; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .host-actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; justify-content: center; width: 100%; }
        .host-actions button { width: auto; padding: 0.5rem 1rem; font-size: 0.85rem; margin: 0; }

        .hero-panel {
            background: rgba(15, 23, 42, 0.95); border-top: 1px solid var(--card-border);
            padding: 1.5rem; z-index: 20; width: 100%;
        }

        .hero-stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; max-width: 800px; margin-inline: auto; }
        .hero-info div:first-child { font-size: 0.9rem; color: var(--text-muted); }
        .hero-info div:last-child { font-size: 1.8rem; font-weight: 900; color: var(--success); }
        .hero-bet { text-align: right; color: var(--warning); font-size: 1.2rem; font-weight: 700; }

        .action-controls {
            display: flex; gap: 0.5rem; max-width: 800px; margin: 0 auto;
        }
        .action-controls button { flex: 1; padding: 1.2rem; font-size: 1.1rem; }
        
        .raise-wrapper { flex: 2; display: flex; gap: 0.5rem; }
        .raise-wrapper input { margin: 0; width: 50%; text-align: center; font-weight: 700; font-size: 1.1rem; }
        .raise-wrapper button { width: 50%; }

    </style>
</head>
<body>

    <div id="view-lobby" class="lobby-container">
        <h1 style="text-align: center; margin-bottom: 2rem;">Mesa de Poker Pro</h1>
        
        <input type="text" id="p-name" placeholder="Tu Nombre">
        
        <div id="host-config" style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;">
            <label style="font-size: 0.8rem; color: var(--accent);">CONFIGURACIÓN DE HOST</label>
            <input type="number" id="c-stack" value="10000" placeholder="Stack Inicial" style="margin-top: 0.5rem;">
            <div style="display: flex; gap: 1rem;">
                <input type="number" id="c-sb" value="50" placeholder="Ciega Pequeña">
                <input type="number" id="c-bb" value="100" placeholder="Ciega Grande">
            </div>
            <button id="btn-create">Crear Sala</button>
        </div>
        
        <div style="text-align: center; margin: 1rem 0; color: var(--text-muted);">--- O ---</div>
        
        <input type="text" id="j-room" placeholder="ID de Sala">
        <button id="btn-join" class="secondary">Unirse</button>
    </div>

    <div id="view-table" class="table-view hidden">
        <div class="header-bar">
            <div>SALA: <strong id="ui-room" style="color:white; cursor:pointer;">---</strong></div>
            <div>CIEGAS: <strong id="ui-blinds" style="color:white;">---</strong></div>
        </div>

        <div class="game-area">
            <div id="opponents-container" class="opponents-ring"></div>

            <div class="center-table">
                <div id="ui-phase" class="phase-indicator">ESPERANDO JUGADORES</div>
                <div id="ui-pot" class="pot-total">0</div>
                <div id="host-controls" class="host-actions hidden"></div>
            </div>
        </div>

        <div id="hero-panel" class="hero-panel">
            <div class="hero-stats">
                <div class="hero-info">
                    <div id="hero-name">TÚ</div>
                    <div id="hero-chips">0</div>
                </div>
                <div class="hero-bet" id="hero-current-bet">Apuesta: 0</div>
            </div>
            <div id="hero-actions" class="action-controls hidden">
                <button class="danger" onclick="sendAction('FOLD')">FOLD</button>
                <button class="secondary" id="btn-check-call" onclick="sendAction('CALL')">CHECK</button>
                <div class="raise-wrapper">
                    <input type="number" id="raise-amt" step="10">
                    <button class="success" onclick="sendRaise()">RAISE</button>
                </div>
            </div>
            <div id="hero-waiting" style="text-align: center; color: var(--text-muted); font-style: italic;">
                Esperando tu turno...
            </div>
        </div>
    </div>

    <script>
        // --- Estado Global ---
        const s = {
            isHost: false, myId: null, hostId: null,
            cfg: { stack: 10000, sb: 50, bb: 100 },
            game: {
                phase: 'WAITING', 
                pot: 0,
                currentBet: 0, 
                dealerIdx: -1,
                turnIdx: -1,
                players: [] 
            }
        };

        let peer, hostConn, clients = new Map();

        // --- Inicialización ---
        document.getElementById('btn-create').onclick = () => {
            s.isHost = true;
            s.cfg.stack = parseInt(document.getElementById('c-stack').value) || 10000;
            s.cfg.sb = parseInt(document.getElementById('c-sb').value) || 50;
            s.cfg.bb = parseInt(document.getElementById('c-bb').value) || 100;
            initPeer(Math.random().toString(36).substring(2,7).toUpperCase(), (id) => {
                s.hostId = id;
                addPlayer(id, document.getElementById('p-name').value || 'Host');
                showTable();
                setupHost();
            });
        };

        document.getElementById('btn-join').onclick = () => {
            const room = document.getElementById('j-room').value.toUpperCase();
            if(!room) return;
            initPeer(null, () => {
                hostConn = peer.connect(room, { reliable: true });
                hostConn.on('open', () => {
                    hostConn.send({ type: 'JOIN', name: document.getElementById('p-name').value || 'Jugador' });
                    showTable();
                });
                hostConn.on('data', d => { if(d.type === 'SYNC') { s.game = d.game; s.cfg = d.cfg; render(); } });
            });
        };

        document.getElementById('ui-room').onclick = () => navigator.clipboard.writeText(s.hostId);

        function initPeer(id, cb) {
            peer = new Peer(id);
            peer.on('open', pid => { s.myId = pid; cb(pid); });
            peer.on('error', e => alert('Error: ' + e.type));
        }

        function showTable() {
            document.getElementById('view-lobby').classList.add('hidden');
            document.getElementById('view-table').classList.remove('hidden');
        }

        // --- Core Lógica Host ---
        function setupHost() {
            peer.on('connection', conn => {
                conn.on('data', msg => {
                    if(msg.type === 'JOIN') {
                        clients.set(conn.peer, conn);
                        addPlayer(conn.peer, msg.name);
                        sync();
                    } else {
                        processAction(conn.peer, msg);
                    }
                });
                conn.on('close', () => {
                    clients.delete(conn.peer);
                    const p = s.game.players.find(x => x.id === conn.peer);
                    if(p) p.status = 'FOLDED';
                    checkAdvancePhase();
                    sync();
                });
            });
        }

        function addPlayer(id, name) {
            s.game.players.push({ id, name, chips: s.cfg.stack, betRound: 0, status: 'ACTIVE', acted: false });
        }

        function sync() {
            render();
            const payload = { type: 'SYNC', game: s.game, cfg: s.cfg };
            clients.forEach(c => c.send(payload));
        }

        // --- Máquina de Estados Hold'em ---
        function hostStartHand() {
            if(s.game.players.length < 2) return;
            s.game.phase = 'PREFLOP';
            s.game.pot = 0;
            s.game.currentBet = s.cfg.bb;
            s.game.dealerIdx = (s.game.dealerIdx + 1) % s.game.players.length;
            
            s.game.players.forEach(p => {
                if(p.chips > 0) { p.status = 'ACTIVE'; p.betRound = 0; p.acted = false; }
                else { p.status = 'FOLDED'; p.betRound = 0; }
            });

            const len = s.game.players.length;
            const sbIdx = (s.game.dealerIdx + 1) % len;
            const bbIdx = (s.game.dealerIdx + 2) % len;
            s.game.turnIdx = (s.game.dealerIdx + 3) % len;

            forceBet(sbIdx, s.cfg.sb);
            forceBet(bbIdx, s.cfg.bb);
            ensureValidTurn();
            sync();
        }

        function forceBet(idx, amt) {
            const p = s.game.players[idx];
            if(p.status !== 'ACTIVE') return;
            const realAmt = Math.min(p.chips, amt);
            p.chips -= realAmt;
            p.betRound += realAmt;
            if(p.chips === 0) p.status = 'ALLIN';
        }

        function processAction(pid, act) {
            const p = s.game.players.find(x => x.id === pid);
            if(!p || s.game.players[s.game.turnIdx].id !== pid || p.status !== 'ACTIVE') return;

            p.acted = true;
            const callAmt = s.game.currentBet - p.betRound;

            if (act.type === 'FOLD') {
                p.status = 'FOLDED';
            } 
            else if (act.type === 'CALL') {
                const amt = Math.min(p.chips, callAmt);
                p.chips -= amt; p.betRound += amt;
                if(p.chips === 0) p.status = 'ALLIN';
            } 
            else if (act.type === 'RAISE') {
                const raiseTotal = act.amount; 
                if (raiseTotal > s.game.currentBet && raiseTotal <= p.chips + p.betRound) {
                    const addAmt = raiseTotal - p.betRound;
                    p.chips -= addAmt;
                    p.betRound = raiseTotal;
                    s.game.currentBet = raiseTotal;
                    if(p.chips === 0) p.status = 'ALLIN';
                    s.game.players.forEach(x => { if(x.id !== p.id && x.status === 'ACTIVE') x.acted = false; });
                }
            }
            advanceTurn();
            sync();
        }

        function advanceTurn() {
            checkAdvancePhase();
            if(s.game.phase === 'SHOWDOWN') return;
            
            s.game.turnIdx = (s.game.turnIdx + 1) % s.game.players.length;
            ensureValidTurn();
        }

        function ensureValidTurn() {
            let loops = 0;
            while(s.game.players[s.game.turnIdx].status !== 'ACTIVE' && loops < s.game.players.length) {
                s.game.turnIdx = (s.game.turnIdx + 1) % s.game.players.length;
                loops++;
            }
        }

        function checkAdvancePhase() {
            const actives = s.game.players.filter(p => p.status === 'ACTIVE');
            const unacted = actives.filter(p => !p.acted || p.betRound < s.game.currentBet);
            const nonFolded = s.game.players.filter(p => p.status !== 'FOLDED');

            if(nonFolded.length === 1) {
                gatherBets(); s.game.phase = 'SHOWDOWN'; return;
            }

            if(actives.length <= 1 && unacted.length === 0) {
                gatherBets(); s.game.phase = 'SHOWDOWN'; return;
            }

            if(unacted.length === 0) {
                gatherBets();
                const phases = ['PREFLOP', 'FLOP', 'TURN', 'RIVER', 'SHOWDOWN'];
                const next = phases[phases.indexOf(s.game.phase) + 1];
                s.game.phase = next;
                if(next !== 'SHOWDOWN') {
                    s.game.currentBet = 0;
                    s.game.players.forEach(p => p.acted = false);
                    s.game.turnIdx = (s.game.dealerIdx + 1) % s.game.players.length;
                    ensureValidTurn();
                }
            }
        }

        function gatherBets() {
            s.game.players.forEach(p => { s.game.pot += p.betRound; p.betRound = 0; });
        }

        function hostAwardPot(pid) {
            const p = s.game.players.find(x => x.id === pid);
            if(p) { p.chips += s.game.pot; s.game.pot = 0; s.game.phase = 'WAITING'; sync(); }
        }

        // --- Cliente Envío ---
        function sendAction(type) {
            let payload = { type };
            if(type === 'RAISE') payload.amount = parseInt(document.getElementById('raise-amt').value);
            if(s.isHost) processAction(s.myId, payload); else hostConn.send(payload);
        }

        // --- Renderizado ---
        function render() {
            document.getElementById('ui-room').innerText = s.hostId || '---';
            document.getElementById('ui-blinds').innerText = `${s.cfg.sb}/${s.cfg.bb}`;
            document.getElementById('ui-phase').innerText = s.game.phase;
            document.getElementById('ui-pot').innerText = s.game.pot.toLocaleString();

            const oppContainer = document.getElementById('opponents-container');
            const hControls = document.getElementById('host-controls');
            oppContainer.innerHTML = ''; hControls.innerHTML = '';
            
            let myPlayer = null;

            s.game.players.forEach((p, idx) => {
                if(p.id === s.myId) { myPlayer = p; }
                else {
                    const isTurn = s.game.turnIdx === idx && s.game.phase !== 'SHOWDOWN' && s.game.phase !== 'WAITING';
                    const isD = s.game.dealerIdx === idx;
                    oppContainer.innerHTML += `
                        <div class="opponent-card ${isTurn ? 'is-turn' : ''} ${p.status === 'FOLDED' ? 'folded' : ''}">
                            ${isD ? '<div class="dealer-btn">D</div>' : ''}
                            <div class="op-name">${p.name}</div>
                            <div class="op-chips">${p.chips.toLocaleString()}</div>
                            <div class="op-bet">${p.betRound > 0 ? '+'+p.betRound : ''}</div>
                            <div class="op-status" style="color: ${p.status==='ACTIVE'?'var(--success)':'var(--danger)'}">${p.status}</div>
                        </div>
                    `;
                }

                if(s.isHost && (s.game.phase === 'SHOWDOWN' || s.game.phase === 'WAITING')) {
                    hControls.classList.remove('hidden');
                    if(s.game.phase === 'WAITING') {
                        hControls.innerHTML = `<button class="success" onclick="hostStartHand()" style="width:100%">INICIAR MANO</button>`;
                    } else {
                        if(p.status !== 'FOLDED') {
                            hControls.innerHTML += `<button onclick="hostAwardPot('${p.id}')">Dar Pozo a ${p.name}</button>`;
                        }
                    }
                } else if(s.isHost) {
                    hControls.classList.add('hidden');
                }
            });

            if(myPlayer) {
                document.getElementById('hero-chips').innerText = myPlayer.chips.toLocaleString();
                document.getElementById('hero-current-bet').innerText = myPlayer.betRound > 0 ? `+${myPlayer.betRound}` : '';
                
                const isMyTurn = s.game.turnIdx === s.game.players.findIndex(x => x.id === s.myId) && s.game.phase !== 'SHOWDOWN' && s.game.phase !== 'WAITING';
                const actCtrl = document.getElementById('hero-actions');
                const waitCtrl = document.getElementById('hero-waiting');
                
                if(isMyTurn && myPlayer.status === 'ACTIVE') {
                    actCtrl.classList.remove('hidden'); waitCtrl.classList.add('hidden');
                    const callAmt = s.game.currentBet - myPlayer.betRound;
                    const btnCC = document.getElementById('btn-check-call');
                    btnCC.innerText = callAmt > 0 ? `CALL ${callAmt}` : 'CHECK';
                    const minRaise = s.game.currentBet === 0 ? s.cfg.bb : s.game.currentBet * 2;
                    document.getElementById('raise-amt').min = minRaise;
                    document.getElementById('raise-amt').value = minRaise;
                } else {
                    actCtrl.classList.add('hidden'); waitCtrl.classList.remove('hidden');
                    waitCtrl.innerText = myPlayer.status === 'FOLDED' ? 'Te has retirado' : 
                                         (s.game.phase === 'WAITING' ? 'Esperando al Host...' : 'Esperando turno...');
                }
            }
        }
    </script>
</body>
</html>
